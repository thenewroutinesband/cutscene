<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0823">
  <title>CUT SCENE — The New Routines</title>
  <style>
    :root{--ink:#1a0823;--panel:#31113f;--panel2:#55245f;--cloud:#9c397d;--pink:#ef79b5;--teal:#18aaa0;--gold:#ffb80e;--cream:#ffe7ad;--line:#f8cf92;--screen:#16091d;--font:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    *{box-sizing:border-box} html{min-height:100%;background:var(--ink)} body{min-width:320px;min-height:100%;margin:0;background:radial-gradient(circle at 50% 0,#54204e 0,#1a0823 58%,#0c0611 100%);color:#fff;font-family:var(--font);overflow-x:hidden}
    button{font:inherit;touch-action:manipulation} .sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
    #app{width:min(100%,760px);margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));}
    .cabinet{position:relative;border:3px solid #b65ba0;border-radius:27px;background:linear-gradient(145deg,rgba(88,28,89,.96),rgba(20,7,28,.98));box-shadow:0 0 0 4px #210b2d,0 20px 60px #000a,0 0 40px #cb55a466;overflow:hidden}
    .cabinet:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.23;z-index:8;background-image:url("data:image/svg+xml,%3Csvg width='72' height='72' viewBox='0 0 72 72' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
    .brandbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:9px 13px;background:#16071e;border-bottom:2px solid #a64c96;position:relative;z-index:9;font-size:10px;letter-spacing:.12em;color:#ffc5dc}
    .brand{color:#ffcd55;font-weight:900;letter-spacing:.18em;text-shadow:2px 2px 0 #651849}.brand i{color:#25b7aa;font-style:normal}.top-actions{display:flex;gap:6px}.hudbutton{border:1px solid #d873b5;border-radius:7px;background:#35113f;color:#fff7df;padding:5px 7px;font-size:9px;font-weight:800;cursor:pointer}.hudbutton:focus-visible,.choice:focus-visible,.action:focus-visible,.dkey:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
    .screen{position:relative;margin:10px;border:3px solid #130717;border-radius:11px;overflow:hidden;background:#0d0611;box-shadow:inset 0 0 0 2px #89407e,inset 0 0 30px #000b;isolation:isolate}.upper{height:clamp(230px,58vw,440px)}.lower{min-height:225px;display:flex;flex-direction:column;background:linear-gradient(160deg,#2b103b,#170a21);border-color:#100614}
    .upper:after{content:"";position:absolute;z-index:6;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.045) 1px 3px),radial-gradient(ellipse at 50% 55%,transparent 40%,rgba(11,2,15,.5));mix-blend-mode:soft-light}
    #field{position:absolute;inset:0;overflow:hidden;background-position:center bottom;background-size:cover;cursor:crosshair}.scene-l1{background-image:linear-gradient(#17051b22,#17051b55),url('./level-01-environment.png')}.scene-road{background-image:linear-gradient(90deg,#1a0622aa,#1a062200),url('./level-01-environment.png');background-position:34% bottom;animation:roadshift 2s linear infinite}.scene-l2{background-image:linear-gradient(#17051b15,#17051b50),url('./level-02-storm-field.png')}
    @keyframes roadshift{from{background-position:37% bottom}to{background-position:62% bottom}}
    .rain{position:absolute;inset:-10%;z-index:2;pointer-events:none;opacity:.72;background-image:repeating-linear-gradient(108deg,transparent 0 37px,rgba(26,214,196,.94) 38px 40px,transparent 41px 84px);background-size:100px 128px;animation:rain .43s linear infinite;mix-blend-mode:screen}.rain:after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(108deg,transparent 0 88px,rgba(80,255,215,.6) 89px 91px,transparent 92px 170px);background-size:166px 210px;animation:rain .66s linear infinite reverse}@keyframes rain{from{transform:translate3d(0,-18px,0)}to{transform:translate3d(-32px,44px,0)}}
    .vignette{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(90deg,rgba(24,4,32,.32),transparent 30%,transparent 70%,rgba(24,4,32,.4)),linear-gradient(0deg,rgba(12,3,19,.48),transparent 30%)}
    .fox{position:absolute;z-index:5;width:82px;height:82px;background:url('./fox-sprite-sheet.png') 0 0/400% 100% no-repeat;image-rendering:pixelated;filter:drop-shadow(3px 5px 0 rgba(28,4,32,.72));transform:translate(-50%,-100%);transition:left .65s cubic-bezier(.2,.75,.25,1),top .65s cubic-bezier(.2,.75,.25,1)}
    .fox.walk{animation:walk .38s steps(2,end) infinite}.fox.eat{animation:eat .45s steps(2,end) infinite}.fox.shake{animation:shake .16s steps(2,end) 10}@keyframes walk{to{background-position:66.666% 0}}@keyframes eat{to{background-position:100% 0}}@keyframes shake{0%,100%{margin-left:0;transform:translate(-50%,-100%) rotate(0)}50%{margin-left:8px;transform:translate(-50%,-100%) rotate(-3deg)}}
    .bin{position:absolute;z-index:5;width:83px;transform:translate(-50%,-100%);filter:drop-shadow(3px 5px 0 #19051d);cursor:pointer;transition:filter .2s,transform .2s}.bin.near{filter:drop-shadow(0 0 8px #ffcb45) drop-shadow(3px 5px 0 #19051d);animation:binpulse 1s steps(2,end) infinite}.bin.nudge{animation:binshake .32s ease-in-out 3}@keyframes binpulse{50%{filter:drop-shadow(0 0 18px #ffdb62) drop-shadow(3px 5px 0 #19051d)}}@keyframes binshake{25%{transform:translate(-56%,-100%) rotate(-5deg)}75%{transform:translate(-44%,-100%) rotate(4deg)}}
    .scrap{position:absolute;z-index:5;width:19px;height:13px;border:3px solid #ffe7a3;background:#ee9435;box-shadow:2px 2px #4b164b;transform:rotate(-9deg);animation:glint .6s steps(2,end) infinite}@keyframes glint{50%{filter:brightness(1.6);transform:rotate(-9deg) scale(1.16)}}
    .beacon{position:absolute;z-index:5;width:42px;height:42px;border:4px solid #ffe18c;border-radius:50%;background:radial-gradient(circle,#fff5be 0 16%,#ffb20d 18% 38%,#d26132 42% 50%,transparent 52%);box-shadow:0 0 10px #ffe26f,0 0 32px #ff9f12;transform:translate(-50%,-50%);animation:beacon 1.1s steps(2,end) infinite;cursor:pointer}.beacon.future{opacity:.42;filter:saturate(.4)}.beacon.done{opacity:.2;filter:grayscale(1);animation:none}@keyframes beacon{50%{box-shadow:0 0 20px #ffe26f,0 0 58px #ff9f12;transform:translate(-50%,-50%) scale(1.12)}}
    .frankie{position:absolute;z-index:4;right:-3%;bottom:7%;width:min(50%,330px);filter:drop-shadow(6px 8px 0 #1a0621);opacity:0;transform:translateX(20px);transition:opacity .6s,transform .6s}.frankie.visible{opacity:1;transform:translateX(0)}.frankie-name{position:absolute;z-index:6;right:16%;bottom:22%;padding:3px 5px;background:#fcad11;color:#5a154d;border:2px solid #68174c;font-size:9px;font-weight:900;letter-spacing:.12em;transform:rotate(-3deg);opacity:0}.frankie-name.visible{opacity:1}
    .objective{position:absolute;z-index:7;top:10px;right:10px;max-width:66%;padding:6px 8px;border:2px solid #f3bf70;background:#2b0d3ee8;color:#fff0c1;font-size:9px;line-height:1.35;text-transform:uppercase;letter-spacing:.06em;text-align:right;box-shadow:3px 3px 0 #14051b}.objective b{color:#26d3bf}
    .hearts{position:absolute;z-index:7;top:9px;left:9px;display:flex;gap:1px;padding:5px 7px;border:2px solid #dc9f62;background:#2a0c3ce8;color:#ff6a8e;font-size:17px;letter-spacing:-3px;text-shadow:1px 1px #791a48}.hearts span.empty{color:#6e496f}.hearts small{margin-left:7px;color:#ffe2a5;font-size:8px;letter-spacing:0;align-self:center}
    #rewardBurst{display:none;position:absolute;z-index:20;inset:0;place-items:center;background:#21092c88;pointer-events:none}#rewardBurst.show{display:grid;animation:burst 2.2s both}.reward-core{border:4px solid #ffd568;background:#4f1658;padding:18px 20px;text-align:center;box-shadow:0 0 0 5px #21082d,0 0 38px #ff9d42;color:#fff1bd;transform:rotate(-2deg)}.reward-core strong{display:block;color:#ff7194;font-size:32px;letter-spacing:-6px}.reward-core em{display:block;margin-top:7px;font-size:10px;font-style:normal;letter-spacing:.13em}@keyframes burst{0%,100%{opacity:0;transform:scale(.35)}12%,75%{opacity:1;transform:scale(1)}85%{opacity:1;transform:scale(.62) translate(-35%,-38%)}}
    .lower-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;padding:8px 12px;border-bottom:2px solid #8c427d;background:#200a2d;color:#ffc77c;font-size:9px;font-weight:900;letter-spacing:.13em}.status-led{display:inline-flex;align-items:center;gap:5px;color:#82e6d5}.status-led:before{content:"";display:inline-block;width:7px;height:7px;background:#32d6be;box-shadow:0 0 8px #32d6be}
    #copy{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px 20px 10px;text-align:center}.eyebrow{margin:0 0 8px;color:#26d3bf;font-size:10px;font-weight:900;letter-spacing:.16em}.copy-title{max-width:590px;margin:0;color:#ffe7ac;font-size:clamp(19px,5vw,30px);line-height:1.05;letter-spacing:-.06em;text-shadow:3px 3px #601850}.copy-title.pink{color:#ff9dca}.copy-body{max-width:560px;margin:12px 0 0;color:#f7d7eb;font-size:12px;line-height:1.55}.copy-body b{color:#ffce56}.tiny{margin-top:9px;color:#bd8db8;font-size:9px;line-height:1.45}
    .choices,.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:15px}.choice,.action{border:3px solid #ffc65a;border-radius:5px;background:#ffb40d;color:#40103d;padding:11px 15px;box-shadow:3px 3px 0 #68194f;font-size:12px;font-weight:900;letter-spacing:.05em;cursor:pointer}.choice.alt,.action.alt{border-color:#cc74aa;background:#3c1648;color:#ffe8bb}.choice:hover,.action:hover{filter:brightness(1.12);transform:translate(-1px,-1px)}.warning{min-height:17px;margin-top:10px;color:#ffd05e;font-size:9px;line-height:1.4}.warning.error{color:#ff96b4}
    .level-grid{display:grid;grid-template-columns:repeat(2,minmax(132px,1fr));gap:7px;width:min(570px,100%);margin-top:12px}.level-card{display:grid;grid-template-columns:29px 1fr auto;align-items:center;gap:7px;padding:8px;border:2px solid #ae5396;background:#431649;color:#ffe6c8;text-align:left;font-size:8px}.level-card b{color:#24cdb9;font-size:17px}.level-card.locked{filter:grayscale(.8);opacity:.6}.level-card .mini{padding:5px;font-size:8px}
    #controls{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:8px 11px 11px}.dpad{display:grid;grid-template-columns:28px 28px 28px;grid-template-rows:28px 28px 28px;gap:2px}.dkey{border:1px solid #c76aaa;background:#41174d;color:#ffe7b1;border-radius:4px;font-weight:900;cursor:pointer}.dkey:hover{background:#632266}.dkey.up{grid-column:2}.dkey.left{grid-row:2;grid-column:1}.dkey.right{grid-row:2;grid-column:3}.dkey.down{grid-row:3;grid-column:2}.control-note{max-width:230px;color:#d5a8c9;font-size:8px;line-height:1.4;text-align:right}.control-note b{color:#4ddcca}
    #rewardsPanel{display:none;position:absolute;z-index:40;inset:42px 7px 7px;padding:18px 13px;background:#20092aeF;border:3px solid #c75fa7;border-radius:16px;overflow:auto}.rewards-head{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#ffe19b;font-weight:900;letter-spacing:.1em}.close{border:0;background:transparent;color:#ffd2e9;font-size:25px;cursor:pointer}.reward-list{display:grid;gap:9px;margin-top:15px}.reward-item{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:11px;border:2px solid #74316d;background:#351242;color:#e0bad7;font-size:10px;line-height:1.3}.reward-item strong{color:#ffcf59;display:block;margin-bottom:3px}.reward-item.locked{filter:grayscale(.8);opacity:.55}.mini{border:2px solid #ffca57;background:#5a194e;color:#fff0c4;padding:7px;font-size:9px;font-weight:900;cursor:pointer}.mini:disabled{opacity:.45;cursor:not-allowed}
    .bottomline{position:absolute;bottom:0;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,#ffb619 0 28px,#e672a6 28px 56px,#1ab5a6 56px 84px)}
    @media(max-width:430px){#app{padding-left:5px;padding-right:5px}.cabinet{border-radius:20px}.screen{margin:6px}.upper{height:clamp(235px,73vw,315px)}.brandbar{font-size:9px}.fox{width:66px;height:66px}.bin{width:67px}.frankie{width:53%}.objective{font-size:8px}.copy-title{font-size:20px}.copy-body{font-size:11px}.choice,.action{font-size:11px;padding:10px 11px}.control-note{font-size:7.5px;max-width:190px}}
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
  'use strict';

  /* Replace these two values before release. Blank values intentionally show a preview warning. */
  const LINKS = {
    presave: '',
    soundcloud: ''
  };
  const STORE_KEY = 'cutscene-progress-v4';
  const root = document.getElementById('app');
  const waypoints = [{x:31,y:65},{x:51,y:48},{x:70,y:39}];
  const l1Bin = {x:76,y:71};
  let music, audioContext, rainGain, noiseSource;
  let game = {
    mode: 'opening', l1Stage: 0, l2Step: 0, note: '',
    fox: {x:34,y:79,pose:'idle'}, sound: true, progress: loadProgress(), timer: null
  };

  function loadProgress(){
    try {
      const stored = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      const legacy = localStorage.getItem('cutscene-level1-complete') || localStorage.getItem('cutsceneLevel1Complete');
      return {l1: Boolean(stored.l1 || legacy), l2: Boolean(stored.l2), presave: Boolean(stored.presave), soundcloud: Boolean(stored.soundcloud)};
    } catch (_) { return {l1:false,l2:false,presave:false,soundcloud:false}; }
  }
  function saveProgress(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(game.progress)); } catch (_) { /* private browsing can block storage */ }
  }
  function clearTimer(){ if(game.timer){ clearTimeout(game.timer); game.timer=null; } }
  function delay(fn, ms){ clearTimer(); game.timer=setTimeout(()=>{game.timer=null;fn();},ms); }
  function esc(value){ return String(value).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function startSound(){
    if(!game.sound) return;
    if(!music){
      music = new Audio('./cutscene-video-game-sound.mp3');
      music.loop = true; music.volume = .14; music.preload = 'auto';
    }
    music.play().catch(()=>{});
    if(!audioContext){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      audioContext = new Ctx();
      const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1) * .18;
      noiseSource = audioContext.createBufferSource(); noiseSource.buffer=buffer; noiseSource.loop=true;
      const filter=audioContext.createBiquadFilter(); filter.type='highpass'; filter.frequency.value=1750;
      rainGain=audioContext.createGain(); rainGain.gain.value=.055;
      noiseSource.connect(filter).connect(rainGain).connect(audioContext.destination); noiseSource.start();
    } else { audioContext.resume().catch(()=>{}); if(rainGain) rainGain.gain.value=.055; }
  }
  function toggleSound(){
    game.sound=!game.sound;
    if(game.sound) startSound();
    if(music) { if(game.sound) music.play().catch(()=>{}); else music.pause(); }
    if(rainGain) rainGain.gain.value = game.sound ? .055 : 0;
    render();
  }
  function sfx(kind){
    if(!game.sound) return; startSound();
    if(!audioContext) return;
    const osc=audioContext.createOscillator(), gain=audioContext.createGain();
    const settings={step:[180,.055,.055],click:[420,.06,.075],scrap:[95,.18,.12],heart:[520,.16,.12],wrong:[115,.06,.08],arrival:[330,.2,.16]}[kind] || [250,.05,.05];
    osc.type = kind==='scrap' ? 'sawtooth' : 'square'; osc.frequency.value=settings[0]; gain.gain.value=settings[1];
    osc.connect(gain).connect(audioContext.destination); osc.start();
    osc.frequency.exponentialRampToValueAtTime(Math.max(55,settings[0]*.65), audioContext.currentTime+settings[2]);
    gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+settings[2]); osc.stop(audioContext.currentTime+settings[2]+.02);
  }

  function resetFoxFor(mode){
    if(mode==='l1') game.fox={x:34,y:79,pose:'idle'};
    if(mode==='l2') game.fox={x:15,y:79,pose:'idle'};
    if(mode==='road') game.fox={x:11,y:80,pose:'walk'};
  }
  function setMode(mode){
    clearTimer(); game.mode=mode; game.note=''; game.arriving=false;
    if(mode==='l1'){ game.l1Stage=0; resetFoxFor('l1'); }
    if(mode==='l2'){ game.l2Step=0; resetFoxFor('l2'); }
    if(mode==='road'){
      resetFoxFor('road');
      delay(()=>{ game.mode='opening'; game.note='YOU KEEP DRIVING INTO THE RAIN.'; render(); },2600);
    }
    render();
  }
  function sceneClass(){ return game.mode==='l2' ? 'scene-l2' : game.mode==='road' ? 'scene-road' : 'scene-l1'; }
  function hearts(){
    const filled=game.l1Stage>=4 ? 5 : 1;
    return `<div class="hearts" aria-label="Health: ${filled} of 5 hearts">${Array.from({length:5},(_,i)=>`<span class="${i<filled?'':'empty'}">♥</span>`).join('')}<small>${filled}/5</small></div>`;
  }
  function foxMarkup(){
    return `<div class="fox ${esc(game.fox.pose)}" aria-label="Fox" style="left:${game.fox.x}%;top:${game.fox.y}%"></div>`;
  }
  function topMarkup(){
    const isL1=game.mode==='l1', isL2=game.mode==='l2';
    let objects='';
    if(isL1){
      const binClass=['','near','nudge','nudge','near',''][game.l1Stage] || '';
      objects+=`<img class="bin ${binClass}" data-bin alt="Open wheelie bin" src="./bin-open.png" style="left:${l1Bin.x}%;top:${l1Bin.y}%">`;
      if(game.l1Stage===3) objects+=`<div class="scrap" aria-label="Found scrap" style="left:70%;top:67%"></div>`;
    }
    if(isL2){
      objects+=waypoints.map((point,index)=>`<button class="beacon ${index<game.l2Step?'done':index>game.l2Step?'future':''}" data-beacon="${index}" aria-label="Lit route point ${index+1}" style="left:${point.x}%;top:${point.y}%"></button>`).join('');
      const arrival=game.l2Step>=3;
      objects+=`<img class="frankie ${arrival?'visible':''}" alt="Frankie, a combine harvester" src="./frankie-combine.png"><div class="frankie-name ${arrival?'visible':''}">FRANKIE</div>`;
    }
    const objective = isL1 ? (game.l1Stage<1?'FIND SOMETHING TO <b>EAT</b>':game.l1Stage<4?'CHECK THE <b>BIN</b>':'YOU ARE <b>SAFE</b>') : isL2 ? (game.l2Step<3?'FOLLOW THE <b>LIT POINTS</b>': 'REACH <b>FRANKIE</b>') : game.mode==='road' ? 'DRIVING <b>THROUGH THE RAIN</b>' : 'THE NIGHT <b>KEEPS MOVING</b>';
    return `<section class="screen upper" aria-label="Game action"><div id="field" class="${sceneClass()}" data-field>${objects}${foxMarkup()}<div class="rain"></div><div class="vignette"></div><div class="objective">${objective}</div>${(isL1||isL2)?hearts():''}<div id="rewardBurst"><div class="reward-core"><strong>♥ ♥ ♥ ♥ ♥</strong><em>YOU FOUND A WAY THROUGH</em></div></div></div></section>`;
  }

  function levelCards(){
    const l2 = game.progress.l1;
    return `<div class="level-grid">
      <div class="level-card"><b>01</b><span>PETROL STATION</span><button class="mini" data-action="start-l1">${game.progress.l1?'REPLAY':'PLAY'}</button></div>
      <div class="level-card ${l2?'':'locked'}"><b>02</b><span>STORM FIELD</span><button class="mini" data-action="start-l2" ${l2?'':'disabled'}>${game.progress.l2?'REPLAY':l2?'PLAY':'LOCKED'}</button></div>
      <div class="level-card locked"><b>03</b><span>PHONE CALL</span><button class="mini" disabled>LOCKED</button></div>
      <div class="level-card locked"><b>04</b><span>MESSAGE</span><button class="mini" disabled>LOCKED</button></div>
    </div>`;
  }
  function lowerCopy(){
    if(game.mode==='opening') return {
      label:'ROAD // 00', title:'KEEP DRIVING?', body:'The rain keeps time. You can stay in motion, or pull in at the light.', buttons:`<button class="choice" data-action="road">YES</button><button class="choice alt" data-action="start-l1">NO</button>`, note:game.note
    };
    if(game.mode==='road') return {label:'ROAD LOOP',title:'JUST A LITTLE FURTHER…',body:'Headlights pull the wet road beneath you. The same sign returns through the weather.',buttons:'',note:'THE LOOP WILL RETURN YOU TO THE CHOICE.'};
    if(game.mode==='menu') return {label:'LEVEL SELECT',title:'WHERE TO NEXT?',body:'Level 1 is open. Find food first, then follow the lights through the storm.',buttons:levelCards(),note:game.note};
    if(game.mode==='l1'){
      const stages=[
        ['PETROL STATION // 01','FIND SOMETHING TO EAT','Tap the ground beside the bin to guide the fox over.',''],
        ['PETROL STATION // 01','THERE’S A BIN HERE','Now tap the bin itself. A small nudge could be enough.',''],
        ['PETROL STATION // 01','THE LID RATTLES','Something is shifting in the dark…',''],
        ['PETROL STATION // 01','A SCRAP OF FOOD','It is not much, but it is enough.','<button class="action" data-action="eat">EAT THE SCRAP</button>'],
        ['PETROL STATION // 01','WARMTH RETURNS','For a second, the whole world feels closer.',''],
        ['PETROL STATION // 01','CUTSCENE — OUT 15 JANUARY 2027','The petrol-station sign flickers back to life.','<button class="action" data-action="menu">CONTINUE</button>']
      ][game.l1Stage];
      return {label:stages[0],title:stages[1],body:stages[2],buttons:stages[3],note:game.note};
    }
    if(game.mode==='l2'){
      if(game.l2Step<3 || game.arriving) return {label:'STORM FIELD // 02',title:game.arriving?'THE SHELTER IS AHEAD':`FOLLOW THE LIGHTS — ${game.l2Step+1}/3`,body:game.arriving?'Frankie’s torch is cutting through the rain.':'Tap the glowing point ahead. Ignore everything else and stay with the light.',buttons:'',note:game.note || 'THE STORM CANNOT MOVE YOU OFF COURSE.'};
      return {label:'STORM FIELD // 02',title:'YOU MADE IT TO FRANKIE',body:'“Frankie’s gonna keep you out of harm’s way”',buttons:`<button class="action" data-action="presave">PRE-SAVE CUTSCENE</button><button class="action alt" data-action="finish-l2">CONTINUE</button>`,note:game.note};
    }
    return {label:'CUT SCENE',title:'THE RAIN IS WAITING',body:'',buttons:'',note:''};
  }
  function lowerMarkup(){
    const copy=lowerCopy();
    return `<section class="screen lower" aria-label="Instructions and rewards">
      <div class="lower-head"><span>${esc(copy.label)}</span><span class="status-led">LIVE</span></div>
      <div id="copy"><p class="eyebrow">THE NEW ROUTINES</p><h1 class="copy-title ${game.mode==='l2'&&game.l2Step>=3?'pink':''}">${esc(copy.title)}</h1><p class="copy-body">${esc(copy.body)}</p><div class="choices actions">${copy.buttons}</div><div class="warning ${String(copy.note||'').startsWith('PREVIEW')?'error':''}">${esc(copy.note||'')}</div></div>
      <div id="controls"><div class="dpad" aria-label="Move fox"><button class="dkey up" data-move="up" aria-label="Move up">▲</button><button class="dkey left" data-move="left" aria-label="Move left">◀</button><button class="dkey right" data-move="right" aria-label="Move right">▶</button><button class="dkey down" data-move="down" aria-label="Move down">▼</button></div><div class="control-note"><b>TAP TO MOVE</b><br>desktop: arrows / WASD · SPACE to interact</div></div><div class="bottomline"></div>
    </section>`;
  }
  function rewardPanel(){
    const l2=game.progress.l2;
    return `<aside id="rewardsPanel" aria-label="Rewards"><div class="rewards-head"><span>REWARDS // CUT SCENE</span><button class="close" data-action="close-rewards" aria-label="Close rewards">×</button></div><div class="reward-list">
      <div class="reward-item ${l2?'':'locked'}"><div><strong>PRE-SAVE CUTSCENE</strong>${l2?'Open the release link without losing your place.':'Reach Frankie to unlock.'}</div><button class="mini" data-action="presave" ${l2?'':'disabled'}>OPEN</button></div>
      <div class="reward-item ${l2?'':'locked'}"><div><strong>PRIVATE SOUND CLOUD</strong>${l2?'Use the private share link after it is added.':'Unlocked after Storm Field.'}</div><button class="mini" data-action="soundcloud" ${l2?'':'disabled'}>OPEN</button></div>
      <div class="reward-item"><div><strong>YOUR PROGRESS</strong>${game.progress.l1?'Level 1 complete':'Level 1 waiting'} · ${game.progress.l2?'Level 2 complete':'Storm Field waiting'}</div><button class="mini" data-action="menu">LEVELS</button></div>
    </div></aside>`;
  }
  function render(){
    const gameplay=game.mode==='l1'||game.mode==='l2';
    root.innerHTML=`<div class="cabinet"><div class="brandbar"><span class="brand">THE NEW <i>ROUTINES</i> // CUT SCENE</span><div class="top-actions"><button class="hudbutton" data-action="home">HOME</button><button class="hudbutton" data-action="rewards">REWARDS</button><button class="hudbutton" data-action="sound">SOUND: ${game.sound?'ON':'OFF'}</button></div></div>${topMarkup()}${lowerMarkup()}${rewardPanel()}</div>`;
    if(!gameplay) document.querySelector('#controls').style.opacity='.48';
  }

  function distance(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
  function showRewards(){ const panel=document.getElementById('rewardsPanel'); if(panel) panel.style.display='block'; }
  function closeRewards(){ const panel=document.getElementById('rewardsPanel'); if(panel) panel.style.display='none'; }
  function approachBin(){
    if(game.l1Stage!==0) return;
    game.l1Stage=1; game.fox={x:66,y:79,pose:'walk'}; game.note='NOW TAP THE BIN.'; sfx('step'); render();
    delay(()=>{ if(game.mode==='l1'&&game.l1Stage===1){game.fox.pose='idle';render();} },650);
  }
  function nudgeBin(){
    if(game.mode!=='l1'||game.l1Stage!==1) return;
    game.l1Stage=2; game.note='THE LID RATTLES IN THE RAIN.'; game.fox.pose='walk'; sfx('scrap'); render();
    delay(()=>{ if(game.mode==='l1'){game.l1Stage=3;game.fox.pose='idle';game.note='YOU FOUND A SCRAP.';render();} },900);
  }
  function eatScrap(){
    if(game.mode!=='l1'||game.l1Stage!==3) return;
    game.l1Stage=4; game.fox.pose='eat'; game.note='HEARTS RETURN.'; sfx('heart'); render();
    const burst=document.getElementById('rewardBurst'); if(burst) burst.classList.add('show');
    delay(()=>{ if(game.mode==='l1'){game.progress.l1=true;saveProgress();game.l1Stage=5;game.fox.pose='idle';game.note='THE SIGN FLICKERS ON.';render();} },2200);
  }
  function activatePoint(index){
    if(game.mode!=='l2'||game.arriving) return;
    if(index!==game.l2Step){ game.note='STAY WITH THE LIT POINT.'; sfx('wrong'); render(); return; }
    const point=waypoints[index]; game.fox={x:point.x,y:Math.min(88,point.y+15),pose:'walk'}; game.l2Step++; game.note=index===2?'THE SHELTER IS CLOSE.':'THE NEXT LIGHT APPEARS.'; sfx('click'); render();
    if(game.l2Step<3){ delay(()=>{ if(game.mode==='l2'){game.fox.pose='idle';render();} },550); return; }
    game.arriving=true; game.fox={x:79,y:81,pose:'walk'}; render();
    delay(()=>{ if(game.mode==='l2'){game.arriving=false;game.fox.pose='shake';game.progress.l2=true;saveProgress();game.note='FRANKIE KEEPS YOU DRY.';sfx('arrival');render();delay(()=>{if(game.mode==='l2'){game.fox.pose='idle';render();}},1500);} },780);
  }
  function fieldTap(event){
    const field=document.getElementById('field'); if(!field) return;
    const rect=field.getBoundingClientRect();
    const point={x:(event.clientX-rect.left)/rect.width*100,y:(event.clientY-rect.top)/rect.height*100};
    if(game.mode==='l1'){
      if(game.l1Stage===0){
        if(distance(point,l1Bin)<26) approachBin();
        else {game.fox={x:Math.max(8,Math.min(91,point.x)),y:Math.max(48,Math.min(88,point.y)),pose:'walk'};game.note='THE BIN IS TO THE RIGHT.';sfx('step');render();delay(()=>{if(game.mode==='l1'&&game.l1Stage===0){game.fox.pose='idle';render();}},450);}
      }
    } else if(game.mode==='l2' && !game.arriving){
      const active=waypoints[game.l2Step];
      if(active && distance(point,active)<12) activatePoint(game.l2Step);
      else {game.note='STAY WITH THE LIT POINT.';sfx('wrong');render();}
    }
  }
  function interact(){
    if(game.mode==='l1'){
      if(game.l1Stage===0 && distance(game.fox,l1Bin)<28) approachBin();
      else if(game.l1Stage===1) nudgeBin();
      else if(game.l1Stage===3) eatScrap();
    } else if(game.mode==='l2' && !game.arriving && game.l2Step<3){
      const active=waypoints[game.l2Step]; if(distance(game.fox,active)<18) activatePoint(game.l2Step);
    }
  }
  function move(dir){
    if(game.mode!=='l1'&&game.mode!=='l2') return;
    const delta={up:[0,-7],down:[0,7],left:[-7,0],right:[7,0]}[dir]; if(!delta) return;
    game.fox.x=Math.max(7,Math.min(93,game.fox.x+delta[0])); game.fox.y=Math.max(45,Math.min(91,game.fox.y+delta[1])); game.fox.pose='walk'; game.note='';sfx('step');render();
    delay(()=>{if(game.mode==='l1'||game.mode==='l2'){game.fox.pose='idle';render();}},240);
  }
  function openLink(kind){
    const url=LINKS[kind];
    if(!url){ game.note=`PREVIEW: ADD THE ${kind==='presave'?'PRE-SAVE':'SOUNDCLOUD'} URL IN INDEX.HTML.`; render(); showRewards(); return; }
    game.progress[kind]=true; saveProgress(); window.open(url,'_blank','noopener'); game.note=`OPENED ${kind==='presave'?'PRE-SAVE':'PRIVATE SOUNDCLOUD'} IN A NEW TAB.`; render();
  }
  function handleAction(action){
    startSound();
    if(action==='road') return setMode('road');
    if(action==='start-l1') return setMode('l1');
    if(action==='start-l2'){ if(game.progress.l1) return setMode('l2'); game.note='FEED THE FOX FIRST.'; return render(); }
    if(action==='eat') return eatScrap();
    if(action==='menu') return setMode('menu');
    if(action==='home') return setMode('opening');
    if(action==='finish-l2'){ if(game.progress.l2){setMode('menu');game.note='STORM FIELD COMPLETE — LEVEL 3 IS STILL LOCKED.';render();} return; }
    if(action==='presave'||action==='soundcloud') return openLink(action);
    if(action==='sound') return toggleSound();
    if(action==='rewards') return showRewards();
    if(action==='close-rewards') return closeRewards();
  }
  document.addEventListener('click', event=>{
    const action=event.target.closest('[data-action]'); if(action){handleAction(action.dataset.action);return;}
    const moveButton=event.target.closest('[data-move]'); if(moveButton){startSound();move(moveButton.dataset.move);return;}
    const bin=event.target.closest('[data-bin]'); if(bin){startSound();nudgeBin();return;}
    const beacon=event.target.closest('[data-beacon]'); if(beacon){startSound();activatePoint(Number(beacon.dataset.beacon));return;}
    if(event.target.closest('[data-field]')){startSound();fieldTap(event);}
  });
  document.addEventListener('keydown', event=>{
    const key=event.key.toLowerCase(); const directions={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
    if(directions[key]){event.preventDefault();startSound();move(directions[key]);}
    if(key===' '||key==='enter'||key==='e'){event.preventDefault();startSound();interact();}
  });
  render();
  </script>
</body>
</html>
